name: Deploy WebAssembly App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten and Compile
        run: |
          # 1. Clone the SDK
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          
          # 2. Install and Activate the latest version
          ./emsdk install latest
          ./emsdk activate latest
          
          # 3. CRUCIAL FIX: Source the environment script to update the PATH
          # This must be done to make 'emcc' visible in the current shell session.
          source ./emsdk_env.sh
          
          # 4. Now, the 'emcc' command will be found and executed
          emcc test1.cpp -s WASM=1 -o index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The path to the directory containing the generated files
          path: .
